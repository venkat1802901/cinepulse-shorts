<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CinePulse Studio</title>
  
  <!-- PWA Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00f0ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CinePulse">
  <link rel="apple-touch-icon" href="static/icon-192.png">
  
  <link rel="stylesheet" href="static/app.css?v=20261114_4">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-wrapper">
      <img src="static/icon-192.png" alt="CinePulse" class="brand-logo">
      <div>
        <div class="brand-title">CINEPULSE</div>
        <div class="brand-subtitle">@CinePulseFlix • Studio Hub</div>
      </div>
    </div>
    <div class="header-right">
      <button id="notif-btn" class="notif-btn" onclick="requestNotificationPermission()">
        🔔 Alerts
      </button>
      <a href="#" onclick="openYouTubeStudio(); return false;" class="studio-launch-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        Studio
      </a>
    </div>
  </header>

  <!-- Status & Deadline Banner -->
  <div class="status-banner">
    <div class="status-info">
      <div class="status-title">⚡ Today's Daily Queue</div>
      <div class="status-detail">4 High-Impact Viral Edits Ready</div>
    </div>
    <div class="timer-box">
      <div class="timer-label">Review Deadline</div>
      <div id="timer-display" class="timer-value">11:30:00</div>
    </div>
  </div>

  <!-- Language Filter Pills -->
  <div class="filters-bar">
    <div id="filter-all" class="filter-pill active" onclick="setFilter('all')">All (4)</div>
    <div id="filter-hindi" class="filter-pill" onclick="setFilter('hindi')">🇮🇳 Hindi</div>
    <div id="filter-telugu" class="filter-pill" onclick="setFilter('telugu')">🎭 Telugu</div>
    <div id="filter-tamil" class="filter-pill" onclick="setFilter('tamil')">⚡ Tamil</div>
    <div id="filter-wildcard" class="filter-pill" onclick="setFilter('wildcard')">🌟 Wildcard</div>
  </div>

  <!-- Dynamic Video Feed Loaded by app.js -->
  <main class="video-feed" id="video-feed">
    <div style="text-align:center; padding: 40px; color: var(--text-muted);">
      Loading today's fresh 60FPS edits...
    </div>
  </main>

  <!-- Bottom Nav Counter & Studio Link -->
  <nav class="bottom-bar">
    <div class="approvals-counter">
      Approved: <span id="approved-counter">0</span> / 2 Selected
    </div>
    <a href="#" onclick="openYouTubeStudio(); return false;" class="studio-launch-btn">
      🚀 Launch YouTube Studio
    </a>
  </nav>

  <!-- Toast Notification -->
  <div id="toast" class="toast-msg">Copied to clipboard!</div>

  <script src="static/app.js?v=20261114_4"></script>
</body>
</html>
