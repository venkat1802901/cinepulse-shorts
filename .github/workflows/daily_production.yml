name: CinePulse Midnight 4-Video Production & App Deploy

on:
  schedule:
    # 18:30 UTC = 12:00 AM IST (Midnight)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from phone!

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  produce-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎬 Install System FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-cjk fonts-indic libass-dev

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Execute Video Generation Engine (Deduplication + Lyrics + 60FPS)
        run: |
          python daily_runner.py

      - name: 📅 Get Today's Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 💾 Commit Deduplication Ledger Back to Repo
        run: |
          git config --global user.name "CinePulse Cloud Bot"
          git config --global user.email "bot@cinepulse.ai"
          git add app/data/channel_ledger.json
          git commit -m "Update deduplication ledger for ${{ steps.date.outputs.date }} [skip ci]" || echo "No ledger changes"
          git push || echo "Push skipped"

      - name: 🌐 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Package CinePulse App & Videos for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy App & Fresh Videos Directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 📱 Dispatch Push Notification to Phone
        run: |
          curl -s -d "🎬 Today's 4 fresh 60FPS viral edits are live in your CinePulse app! Tap to review & approve." \
               -H "Title: CinePulse: New Edits Live!" \
               -H "Priority: high" \
               -H "Tags: movie_camera,fire" \
               -H "Click: https://venkat1802901.github.io/cinepulse-shorts/" \
               https://ntfy.sh/cinepulse_flx_venkat_channel
