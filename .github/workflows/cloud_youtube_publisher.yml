name: CinePulse 100% Cloud YouTube Shorts Auto-Publisher

on:
  schedule:
    # 11:30 UTC = 5:00 PM IST (Daily Evening Prime-Time Drop)
    - cron: '30 11 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from your phone via GitHub!

permissions:
  contents: write

concurrency:
  group: "youtube-publisher"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Google YouTube Client Libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: 🚀 Publish Next Daily Shorts to @CinePulseFlix
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python youtube_auto_publisher.py --limit 2 --privacy public

      - name: 💾 Commit Published Ledger Back to Repo
        run: |
          git config --global user.name "CinePulse Cloud Publisher"
          git config --global user.email "bot@cinepulse.ai"
          git add app/data/published_ledger.json
          git commit -m "Record published YouTube Shorts in ledger [skip ci]" || echo "No new published videos"
          git push || echo "Push skipped"
